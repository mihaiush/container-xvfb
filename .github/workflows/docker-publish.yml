name: Build and Push Docker Image (amd64)

permissions:
  contents: read
  packages: write

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
   
jobs:
  call-docker-publish:
    uses: mihaiush/ci/.github/workflows/docker-publish.yml@main
    with:
      dockervars: |
        TAG=$(awk -F'[:"]' '/XVFB_VERSION=/{print $3}' Dockerfile | head -1) 
